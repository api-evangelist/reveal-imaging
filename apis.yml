name: Reveal Imaging
description: Reveal Imaging (Reveal Imaging Technologies) is a security-screening hardware company
  known for CT-based explosives-detection and checkpoint screening systems for aviation and critical
  infrastructure. Founded around 2002 and backed by General Catalyst since 2003, the company was
  acquired into SAIC and its detection business is now part of Leidos. It is a physical-security
  systems provider, not an API provider - enrichment found no public developer portal, API, developer
  documentation, or machine-readable specification hosted under its own name (its former revealimaging.com
  domain now serves Leidos, and the General Catalyst portfolio entry points to saic.com).
